<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tombol Jangan Ditekan - Game web sederhana">
    <title>Tombol Jangan Ditekan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="game-title">Tombol Jangan Ditekan</h1>
        <p class="game-subtitle">Bisakah kamu menahan diri?</p>
    </header>

    <main class="main-content">
        <div class="game-area">
            <div class="button-container">
                <button id="mainButton" class="main-button">JANGAN DITEKAN</button>
                
                <div class="counter-display">
                    <span class="counter-label">Udah lu tekan:</span>
                    <span id="clickCount" class="counter-value">0</span>
                    <span class="counter-label">kali</span>
                </div>
                
                <p id="dynamicMessage" class="dynamic-message">Coba aja kalau berani...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 - Tombol Jangan Ditekan Game</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
